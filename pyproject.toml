[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swaraga"
version = "1.0.0"
description = "Carnatic phrase continuation, reference playback, and recorded-response retrieval"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=14.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
neural = ["torch>=2.14"]

[project.scripts]
swaraga-preprocess = "swaraga.pipeline:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
